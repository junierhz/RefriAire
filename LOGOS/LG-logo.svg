<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <!-- LG Circle Symbol -->
  <g transform="translate(5, 5)">
    <circle cx="20" cy="20" r="19" fill="#A50034"/>
    <!-- G circle stroke -->
    <path d="M 20,4 A 16,16 0 1,0 36,20 L 26,20" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- L shape inside -->
    <polyline points="15,11 15,28 24,28" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Eye dot -->
    <circle cx="14" cy="17" r="1.7" fill="#FFFFFF"/>
  </g>
  <!-- LG Wordmark -->
  <text x="58" y="32" font-family="'Barlow', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="1">LG</text>
  <text x="100" y="24" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">AIR SOLUTIONS</text>
</svg>
